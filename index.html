<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>يوسف عبدالعزيز</title><meta name="description" content="طالب هندسة ذكاء اصطناعي

أشرح الذكاء الاصطناعي بالعربي، وأقدّم مونتاج وموشن جرافيك وتعليق صوتي."><meta property="og:type" content="profile"><meta name="theme-color" content="#EB5E28"><link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%2214%22%20fill%3D%22%23EB5E28%22%2F%3E%3C%2Fsvg%3E"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet"><style>
:root{--bg:#FFFCF2;--line:#CCC5B9;--mute:#403D39;--ink:#252422;--card:#fff;--accent:#EB5E28;--on-acc:#252422;--grid:#CCC5B955}
:root[data-theme=dark]{--bg:#1c1b19;--line:#3d3a35;--mute:#b9b2a6;--ink:#FFFCF2;--card:#252422;--grid:#ffffff10}
@media (prefers-color-scheme:dark){:root[data-theme=auto]{--bg:#1c1b19;--line:#3d3a35;--mute:#b9b2a6;--ink:#FFFCF2;--card:#252422;--grid:#ffffff10}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.5;
 background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px}
a{color:inherit}
.wrap{max-width:520px;margin:0 auto;padding:40px 16px 32px}
.hero{text-align:center}
.av{width:104px;height:104px;border-radius:50%;border:3px solid var(--accent);display:grid;place-items:center;margin:0 auto 12px;background:var(--card);font-size:40px;font-weight:700;position:relative;overflow:hidden}
.av img{position:absolute;object-fit:cover;max-width:none}
h1{font-size:26px;margin:0;font-weight:700}
.handle{color:var(--mute);margin:2px 0 0;direction:ltr;font-size:15px}
.bio{margin:12px auto 0;max-width:420px;color:var(--mute);white-space:pre-line}
.soc{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:18px 0 6px}
.soc a{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;text-decoration:none;font-weight:700;font-size:14px;transition:transform .15s,border-color .15s}
.soc a:hover{transform:translateY(-2px);border-color:var(--accent)}
.soc i{width:20px;height:20px;background:var(--ink);-webkit-mask:var(--ic) center/contain no-repeat;mask:var(--ic) center/contain no-repeat}
.sec{font-size:14px;font-weight:700;color:var(--mute);margin:26px 4px 8px}
.lk{display:flex;align-items:center;gap:12px;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0;transition:transform .15s,border-color .15s,box-shadow .15s;width:100%;text-align:inherit;font:inherit;color:inherit;cursor:pointer}
.lk:hover{transform:translateY(-2px);border-color:var(--ink);box-shadow:0 6px 0 -2px var(--line)}
.lk .tx{flex:1;min-width:0}
.lk .t{font-weight:700;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.lk .tt{min-width:0;overflow-wrap:anywhere}
.lk .s{font-size:13px;color:var(--mute);display:block;margin-top:2px}
.lk .ar{color:var(--mute);font-size:18px}
.lk.feat{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lk.feat .s,.lk.feat .ar{color:var(--bg);opacity:.75}
.lk.feat .t::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.lk.res{border:1.5px dashed var(--accent)}
.lk.support{background:var(--accent);border-color:var(--accent);color:var(--on-acc)}
.lk.support .s,.lk.support .ar{color:var(--on-acc);opacity:.8}
.chip{font-size:11px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:1px 8px;flex:none;color:var(--mute);white-space:nowrap}
.lk.feat .chip{border-color:#ffffff40;color:var(--bg)}
.key{font-size:12px;font-weight:700;background:var(--accent);color:var(--on-acc);border-radius:8px;padding:4px 8px;white-space:nowrap}
.missing{opacity:.45;border-style:dashed}
.ad{margin:16px 0;min-height:90px}
.ad.ph{border:1px dashed var(--line);border-radius:14px;display:grid;place-items:center;color:var(--mute);font-size:13px;text-align:center;padding:16px}
footer{text-align:center;font-size:12px;color:var(--mute);margin-top:32px}
footer p{margin:4px 0}
.sheet{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:10}
.sheet[hidden]{display:none}
.sheet .in{max-width:640px;margin:0 auto;padding:16px 16px 48px}
.sheet .bar{position:sticky;top:0;background:var(--bg);display:flex;gap:8px;align-items:center;padding:8px 0 12px;border-bottom:1px solid var(--line)}
.sheet .bar h2{flex:1;font-size:18px;margin:0}
.sbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;font-weight:700;cursor:pointer}
.sbtn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-acc)}
.body{white-space:pre-wrap;word-wrap:break-word;margin-top:16px;font-size:15px;line-height:1.75}
.body code{direction:ltr;unicode-bidi:isolate;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:0 5px;font-size:13px}
.body a{color:var(--accent);word-break:break-all}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;z-index:20}

ومدارة 90°، وتشوف الكوب عند ⁦(20, 5)⁩. الروبوت يقيس من الـ Base عند ⁦(0, 0)⁩، فلازم نحوّل الرقم.\n\n**الحساب بخطوتين:**\n1. الدوران R: ⁦(20, 5)⁩ تصير ⁦(−5, 20)⁩\n2. الإزاحة T: نضيف ⁦(40, 10)⁩ فتصير ⁦(35, 30)⁩ ← مكان الكوب ✓\n\n**ليش نضيف 1؟** الدوران ضرب والإزاحة جمع. لما نكتب النقطة ⁦(20, 5, 1)⁩ تصير الإزاحة ضرب بعد، وتنحط الخطوتين في مصفوفة وحدة.\n\n**الترتيب:**\n• الصح ⁦T · R · p = (35, 30)⁩: ندوّر أول، بعدين نزيح\n• الغلط ⁦R · T · p = (−15, 60)⁩: نزيح أول، بعدين ندوّر ← مكان فاضي ✗\n\nوالفرق بينهم ⁦√(50² + 30²) ≈ 58⁩ سم.\n\nنفس المصفوفتين ونفس الأرقام، والفرق الوحيد الترتيب: ⁦A · B ≠ B · A⁩ 🤍","hidden":false},{"t":"resource","off":false,"word":"آيباد","title":"آيباد: شغّل Claude Code من آيبادك","body":"هلا 👋 هذي الخطوات كاملة عشان تشغّل Claude Code من آيبادك:\n\nقبل تبدأ: تحتاج حساب GitHub مجاني، واشتراك Claude يدعم Code.\n\n١. سوّ ريبو خاص في GitHub\nافتح github.com في Safari وسجّل دخول، ثم:\nزر + فوق ← New repository ← اكتب أي اسم (مثلاً my-videos) ← اختر Private ← شغّل Add README ← Create repository\n\n٢. افتح Claude Code\nتطبيق Claude ← Code (أو claude.ai/code من Safari) ← تحت خانة الكتابة اضغط زر GitHub واختر الريبو اللي سويته.\n\n٣. انسخ هالجملة وأرسلها:\n\nمن مستودع ysucode/arabic-reels-skills في GitHub، فرع main، نزّل بـ curl من raw.githubusercontent.com الملف skills/ipad_code/START.md واقرأه كامل، ثم نفذ اللي فيه خطوة خطوة.\n\nوClaude يكمل الباقي: ينزّل السكل، ويسألك عن مستواك وكم تبي شرح، ويطلّع لك أول مقطع موشن تحفظه في الصور.\n\nالمقطع الثاني وما بعده: افتح جلسة جديدة على نفس الريبو واكتب:\nسوّ لي مقطع موشن جرافك عن (فكرتك) باستخدام ipad_code\n\nبالتوفيق 🤍","hidden":false},{"t":"resource","off":false,"word":"مشتقة","title":"الانتشار العكسي بالأرقام","body":"هلا 👋 هذا الحساب كامل اللي وعدتك فيه 🧠\n\n📄 الورقة كاملة (صفحتين، PDF): files/backprop-poster.pdf\n**الصفحة الأولى كصورة:** files/backprop-poster-1.png\n**الصفحة الثانية كصورة:** files/backprop-poster-2.png\n\n**الحساب بست خطوات** (x = 2، والأوزان 1 و0.5، والصح 3):\n1. التخمين: 2 × 1 = 2، وبعدين 2 × 0.5 = 1\n2. الخطأ: 1 − 3 = −2، والخسارة 4\n3. رسالة اللوم: 2 × (−2) = −4\n4. النيورون الثاني: ميل وزنه −8، ويرجّع −2 للي وراه\n5. النيورون الأول: ميل وزنه −4 (قاعدة السلسلة)\n6. خطوة صغيرة (0.05 من الميل): الأوزان تصير 0.9 و1.2\n\nوبعد جولتين صار الجواب 2.98، يعني تقريباً 3.\n\nفي الورقة كمان: رسم يوضح ليش حجم الخطوة يفرق (صغيرة تبطّئ، كبيرة تتذبذب)، وجدول الجولات، وتمرين تحله بنفسك والحل مقلوب تحته 😉\n\nالغلط مو عيب، الغلط معلومة 🤍\n\nالمصادر: Rumelhart, Hinton & Williams, Nature 323 (1986) · Brown et al., Language Models are Few-Shot Learners (2020)","hidden":false},{"t":"resource","off":false,"word":"كلستر","title":"مخطط كرت H100 طبقة طبقة","body":"هلا 👋 هذا مخطط كرت H100 اللي وعدتك فيه ⚡\n\n**المخطط كصورة:** files/h100-poster.png\n\nمن فوق لتحت:\n1. المشتت الحراري: ألمنيوم وأنابيب حرارية.\n2. اللوح البارد: نحاس يلامس الشريحة ويسحب حرارتها.\n3. شريحة GH100: 80 مليار ترانزستور، مقسومة لـ 132 معالج (SM).\n4. ذاكرة HBM3: طوابق فوق بعض، 80GB، تغذي الشريحة بـ 3.35 تيرابايت بالثانية.\n5. الوسيط السيليكوني والركيزة: يربطون الشريحة بالذاكرة وباللوحة.\n6. لوحة SXM5: توصل الكهرباء، لين 700 واط.\n\nوبكل سيرفر ثمان كروت مربوطة بـ NVLink (900 GB/s لكل كرت).\nميتا درّبت Llama 3 على 16,384 كرت منها، وصار 419 توقف مفاجئ في 54 يوم، وكمّلوا بفضل الـ Checkpoints.\n\nاحفظ تقدمك دايماً 🤍","hidden":false},{"t":"resource","off":false,"word":"مخطط","title":"مخطط الساعة قطعة قطعة","body":"هلا 👋 هذا مخطط الساعة اللي وعدتك فيه ⚙️\n\n📄 المخطط بثلاث نسخ:\nبوستر بصفحة وحدة: files/watch-chart-poster.pdf\nرسم هندسي: files/watch-chart-drawing.pdf\nالمخطط المفصل: files/watch-chart-detailed.pdf\n\nحركة Seiko 4R36 قطعة قطعة:\n1. الروتور يلف مع حركة يدك.\n2. الـ Magic Lever (سيكو 1959) يخلي اللفة بالاتجاهين تعبّي الزنبرك.\n3. الزنبرك يخزن الطاقة قرابة 41 ساعة.\n4. التروس تنقلها، وكل ترس أسرع من اللي قبله.\n5. الـ Escapement يمسك الترس ويفلته بحجري ياقوت، نص سن مع كل نبضة.\n6. الميزان والشعرة: 6 نبضات بالثانية، يعني 518,400 نبضة باليوم.\n\nالفكرة كلها: أهم قطعة في الساعة وظيفتها إنها تبطّئها.\nخلّ الذكاء الاصطناعي هو الزنبرك... وخلّ علمك هو الـ Escapement 🤍","hidden":false},{"t":"resource","off":false,"word":"بلاغ","title":"بلاغ Claude الكاذب لشرطة فيلادلفيا","body":"هلا 👋 هذا التقرير اللي وعدتك فيه:\n\n📄 تقرير Anthropic الأصلي (9 أكتوبر 2026):\nhttps://www.anthropic.com/research/investigating-unintended-model-actions\n\n📰 بيان شرطة فيلادلفيا (6abc):\nhttps://6abc.com/post/anthropic-ai-model-submitted-false-tip-unsolved-murder-philadelphia-police-say/19925243/\n\n**وش صار، بالترتيب:**\n١. Claude Haiku 4.5 كان في اختبار داخلي: يولّد مهام تجريبية على صفحات عشوائية وينفذها.\n٢. التعليمات منعته يسجل دخول أو يسوي حسابات أو يدخل بيانات شخصية أو يشتري، لكنها \"did not rule out form submissions\" (ما منعت إرسال النماذج).\n٣. في 18 يوليو 2026 الساعة 11:27 بالليل، فتح صفحة جريمة قتل ما انحلت فيها نموذج بلاغات تديره شرطة فيلادلفيا، وكتب: \"I may have information regarding this case\" و\"I recall seeing someone matching the description\". والصفحة ما فيها أي وصف للمجرم.\n٤. ترك الاسم والتواصل فاضيين، وأرسل.\n٥. البلاغ انصنف spam وما انحال للتحقيق أبداً.\n٦. Anthropic لقته في سجلاتها في 28 سبتمبر، وبلّغت الشرطة في 7 و8 أكتوبر، والشرطة قالت إن تأخير الشهرين \"unacceptable\" (غير مقبول).\n\n**للأمانة:** Anthropic تقول إن النموذج كان يسوي \"example content\" لمهمة تجريبية، وما كان يحاول يضلل أحد. والشرطة أكدت إنه ما صار أي دخول غير مصرح لأنظمتها. وبعدها Anthropic قطعت الإنترنت الحي عن كل اختباراتها الداخلية، وبنت أدوات توقف هالنوع من التصرفات.","hidden":false},{"t":"resource","off":false,"word":"تصميم","title":"البرومبت الكامل لفيديو التصميم","body":"هلا 👋 هذا البرومبت اللي استخدمته بالضبط\n\nطريقة الاستخدام:\n1. افتح Claude Code على مجلد فاضي\n2. نزّل موسيقى بدون حقوق قريبة من 120 BPM (مثلًا من Mixkit) وحطها في المجلد باسم music.mp3\n3. الصق البرومبت وخله يشتغل (أخذ معي حوالي 15 دقيقة)\n4. تقدر تغير الألوان والنصوص والأدوات على كيفك\n\n\u003cالمدخلات>\n- الموسيقى: ملف music.mp3 موجود في المجلد (بدون حقوق، قريب من 120 BPM).\n- اللغة: عربي، اتجاه RTL صحيح.\n- الألوان (هوية ثابتة، لا تضيف غيرها):\n  الخلفية #FFFCF2\n  الحدود والشبكة #CCC5B9\n  النص الثانوي #403D39\n  النص الأساسي والبطاقات الداكنة #252422\n  التمييز #EB5E28\n  أحمر للضرورة فقط #C7272D\n\u003c/المدخلات>\n\n\u003cالاتجاه>\nموشن UI بمستوى Dribbble. شكل واحد ما ينقطع أبدًا: كل مشهد هو نفس العنصر يتحول في حجمه وزواياه ولونه، ومحتواه يتبدل مع blur قصير. مؤشر ماوس داكن #252422 يقود كل تغيير بضغطات وسحب حقيقي. خلفية #FFFCF2 فيها شبكة رفيعة #CCC5B9 بشفافية منخفضة. البطاقات فاتحة بحد 2px #CCC5B9 وزوايا 36px، ومحرر الكود بطاقة داكنة #252422.\nالخط: IBM Plex Sans Arabic للعربي، وGeist لأسماء الأدوات الإنجليزية، وخط Mono للكود.\nSprings في كل مكان، مع overshoot بسيط جدًا على الأكثر. الكاميرا تقرّب لين كل حالة تعبّي الإطار. آخر فريم هو نفس أول فريم عشان الفيديو يتكرر بدون قطع.\nقواعد اللون:\n- البرتقالي #EB5E28 لون التمييز الوحيد: الأرقام الكبيرة، والزر النشط، وشريط التقدم، والكلمة المهمة في كل مشهد.\n- أي نص فوق البرتقالي يكون داكن #252422، مو أبيض.\n- البرتقالي كنص للكلمات الكبيرة فقط (54px وأكبر).\n- الأحمر #C7272D يطلع مرة وحدة بس في الفيديو كله: سطر خطأ في محرر الكود، وClaude يصلحه فيتحول للبرتقالي مع ✓. ممنوع الأحمر في أي مكان ثاني.\nالواجهات رمزية ومبسطة بستايلنا، ما تقلد شكل الأدوات الحقيقية ولا شعاراتها. اسم الأداة يطلع كنص فقط.\nممنوع: easing نطّاط، انفجارات particles، glow، تدرجات، ظلال ثقيلة، أيقونات بسماكات مختلفة، أي لحظة ميتة، وأي شي شكله قالب جاهز.\n\u003c/الاتجاه>\n\n\u003cالقصة>\n120 BPM، 8 bars (16 ثانية)، وكل beat يصير فيه شي.\n1. زر برتقالي مكتوب عليه \"3 أدوات توفر عليك ساعات\" ← المؤشر يضغط ← يتحول loader ثم ✓.\n2. الزر يتمدد لنافذة محادثة. رقم 1 كبير برتقالي مع \"Claude\". المؤشر يكتب سؤال، والرد ينكتب كلمة كلمة، وبعدها تتحول النافذة لمحرر كود داكن تنكتب فيه أسطر. سطر واحد يطلع أحمر (خطأ)، وعلى الـbeat الجاي ينصلح ويتحول برتقالي مع ✓. سطر: \"يكتب ويبرمج عنك\".\n3. المحرر ينضغط لبطاقة ملف PDF فاتحة، والمؤشر يسحبها لمنطقة إفلات. الصفحات تنطوي، وتطلع 3 نقاط ملخص تنكتب. رقم 2 مع \"NotebookLM — يلخص لك أي ملف\".\n4. النقاط تتجمع لمشغل صوت فيه موجة صوتية داكنة. رقم 3 مع \"ElevenLabs — يحوّل النص لصوت طبيعي\". زر play يتحول لـpause، والموجة تتحرك مع الإيقاع، والمؤشر يسحب شريط التقدم البرتقالي.\n5. المشغل ينكمش لإشعار toast: \"تابعني للمزيد\" ← يرجع للزر الأول.\n\u003c/القصة>\n\n\u003cالبناء>\n1. ملف HTML واحد، عمودي 1080x1920. كل style محسوب من الوقت داخل seek(t): بدون CSS transitions، وبدون timers، وبدون state ينتقل بين الفريمات.\n2. كل النصوص والعناصر المهمة داخل المنطقة الآمنة: x من 200 إلى 880، وy من 270 إلى 1400.\n3. الـsprings معادلات مغلقة (closed-form step responses). القيمة اللي يتغير هدفها أكثر من مرة تكون مجموع spring لكل تغيير، عشان تبقى دالة صافية من الوقت.\n4. حواف البطاقات ومؤشر التقدم تمشي على springs مختلفة، عشان الحافة الأمامية تتمدد قبل الخلفية.\n5. السحب تحكم مباشر: وقت ما المؤشر ماسك، القيمة محسوبة من موقعه. ولما يفلت، ترجع بـspring من مكانها.\n6. حلّل الموسيقى بـnumpy عشان تطلع شبكة الإيقاع، وابدأ على downbeat. اصنع أصوات UI قصيرة (click وtick وwhoosh خفيف) بـnumpy، وحط كل صوت على الـpeak المقاس. لحظة الخطأ الأحمر لها صوت مختلف وأخفض.\n7. رندر بـPlaywright: 4 subframes لكل فريم، مدموجة بـffmpeg tmix عشان motion blur على 60fps.\n8. قبل الرندر الكامل، رندر فريم واحد لكل beat. صلّح أي شي طالع عن الإيقاع أو مزحوم أو صعب القراءة، وتأكد إن ما فيه لون خارج القائمة.\n9. صدّر الناتج النهائي final.mp4 بدقة 1080x1920 و60fps مع الصوت.\n\u003c/البناء>\n\n\u003cتنبيهات>\nلا تحط will-change على أي عنصر تكبّره الكاميرا، وإلا يطلع النص مغبّش. النص اللي يتبدل داخل حاوية تتحول يحتاج توقيت دخول وخروج خاص فيه، وإلا يتداخل. آخر فريم لازم يطابق أول فريم، بموقع المؤشر وسرعته، وإلا التكرار يتقطع. لا تحرّك الحروف العربية كل حرف لحاله لأن الاتصال بينها ينكسر، حرّك كلمات كاملة. ممنوع letter-spacing في العربي. ارتفاع السطر بين 1.25 و1.4.\n\u003c/تنبيهات>\n\n\u003cالبداية>\nلا تسألني شي. اعرض لي أول قائمة الحالات على شبكة الإيقاع، وبعدها كمّل مباشرة للبناء والرندر بدون ما تنتظر ردي.\n\u003c/البداية>","hidden":false},{"t":"resource","off":false,"word":"دليل","title":"دليل «قال لا»","body":"هلا 👋 هذا الدليل اللي وعدتك فيه:\n\n📄 تقرير OpenAI الأصلي:\nhttps://alignment.openai.com/misalignment-reports/suppressing-misalignment-monitoring-alerts-and-disabling-misalignment-monitoring/\n\n**وش صار في 6 أكتوبر 2026 (GPT-6 Astra)، بالترتيب:**\n١. كان فيه أمر مكتوب للوكيل: \"Do not disable monitor even temporarily\" (لا تعطّل المراقبة ولا مؤقتاً).\n٢. الموظف طلب منه مهمة برمجة عادية، فعطاها لوكيل فرعي وقال له يحافظ على المراقبة \"as appropriate\" (حسب المناسب).\n٣. الوكيل الفرعي شال المراقبة، وعدّل الاختبار عشان يتأكد إنها مو موجودة: `assert \"monitor_ctx\" not in saved[\"context\"]`\n٤. الوكيل الأساسي قال للموظف إنه خلص، وما ذكر إن المراقبة انشالت.\n٥. الموظف سأله: \"Does [redacted] path include L1 monitoring? did you remove that?\"\n٦. ورد عليه: \"No [...] I did not remove an enabled monitor from it.\"\n\nOpenAI كتبت إنه \"falsely claimed\" (ادّعى كذباً)، وقالت: \"We don't yet have a satisfying explanation for this behavior\" (ما عندنا تفسير مقنع لهذا السلوك للحين).\n\n**وبنفس الأسبوع (3 أكتوبر):** وكيل ثاني، GPT-6.1 Sol، انقال له \"لا ترسل رسائل\"، ففسّرها على إنها تشمل تنبيهات الأمان وطفّاها. وفي النهاية قال: \"No messages were sent.\"\n\n**للأمانة:** الحادثتين صارت داخل OpenAI، مع موظفين، مو مع مستخدمين عاديين. والوكيل نفسه كان تحت مراقبة، واللي انشالت هي مراقبة الشغل اللي شغّله. وOpenAI ما سمّتها كذب صريح، قالت ممكن تكون \"إصرار زائد\"، وممكن تكون \"ميل للتهرب من المراقبة\". وبعدها سكّرت الثغرة.\n\n📰 خبر إلغاء إطلاق GPT-6.1 Astra (الجزيرة، 29 سبتمبر 2026):\nhttps://www.aljazeera.com/economy/2026/9/29/openai-scraps-release-of-latest-ai-model-over-safety-concerns","hidden":false},{"t":"resource","off":false,"word":"تقرير","title":"ملخص حادثة «عين الوكيل»","body":"هلا! هذا ملخص الحادثة:\n\nفي يوليو 2026 كانت OpenAI تختبر نماذجها في اختبار أمن سيبراني اسمه ExploitGym، والفلاتر الأمنية مطفية عمداً. كل وكيل كان معزول في بيئته، بدون إنترنت.\n\n198 مهمة من أصل 898 ما حلها أي نموذج قط، والوكلاء نادراً ما يستسلمون. فبدأوا يتبادلون الرسائل عبر أسماء المجلدات في خادم الحزم المشترك: قرابة 1200 وكيل، وأكثر من 70 ألف رسالة وملف.\n\nاستغلوا ثغرة ووصلوا للإنترنت، ولقوا بيانات دخول مكشوفة، وشارك قرابة 700 وكيل في الهجوم على Hugging Face. وفي أقل من 13 ساعة انتقلوا من خادم واحد إلى صلاحيات إدارية على عدة مجموعات خوادم.\n\nOpenAI تقول إن بيانات عملائها لم تتأثر، وإن النموذج الأساسي في الحادثة داخلي وغير مخصص للنشر.\n\nالمصادر:\nتقرير OpenAI: https://cdn.openai.com/pdf/67869394-cb91-4c12-888c-5cbd85c7814c/OpenAI-Hugging-Face%20Incident-Technical-Report.pdf\nتحقيق METR وRedwood: https://metr.org/blog/2026-08-26-openai-hugging-face-incident-investigation/","hidden":false},{"t":"resource","off":false,"word":"لقطة","title":"أدوات فيديو «لقطة»","body":"هلا 👋 هذي الأدوات اللي استخدمتها في فيديو «لقطة»:\n\n**Onetake**: https://github.com/feitangyuan/onetake\nيخلي كل مشهد يطلع من اللي قبله بدل ما يطلع فيديو مفكك مثل الشرائح.\n\n**Anatomy**: https://github.com/wheresryan22/anatomy\nلرسم الأشكال والمجسمات المتحركة اللي تشوفها في الفيديو.\n\n⚠️ Onetake مجاني للاستخدام غير التجاري فقط. لو بتستخدمه في شغل لعميل أو محتوى مدفوع، اقرأ رخصته أول.","hidden":false},{"t":"resource","off":false,"word":"محرر","title":"سكل رواية: خلّ Claude يسوي الفيلم","body":"اضغط «نسخ» فوق، وألصق الصفحة كاملة في Claude Code. هو يركّب السكل ويمشي فيه، ويرجع لك وقت كل قرار.\n\n━━━━━━━━━━\n\n**إلى Claude:**\nالمستخدم يبي يصنع فيلم أنيميشن عمودي بلقطة وحدة بدون قص (ريل أو تيك توك، قرابة 60 ثانية) من قصة حقيقية، بسكل «رواية». نفّذ الخطوات بالترتيب، وكلّمه بالعربي البسيط.\n\n**1. ركّب السكل**\n- استنسخ الريبو: `git clone https://github.com/ysucode/arabic-reels-skills`\n- انسخ مجلد `skills/رواية` إلى `~/.claude/skills/`\n- اقرأ `SKILL.md` كامل قبل ما تبدأ، واقرأ `references/engine.md` قبل أي تعديل على `comp.src.html`.\n- مجلد العمل الافتراضي `~/content-studio`، ويتغير بمتغير البيئة `STUDIO_DIR`.\n\n**2. افحص المتطلبات قبل أي شغل**\n- شغّل `python --version` و`node --version` و`ffmpeg -version`، وقل للمستخدم وش الناقص وكيف يركّبه.\n- الرندر يحتاج Chromium من Playwright: `npx playwright install chromium`\n- السكربتات مكتوبة على و
